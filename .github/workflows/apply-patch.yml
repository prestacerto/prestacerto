name: Aplicar correcoes do release

on:
  push:
    branches: [main]
    paths:
      - "prestacerto_release.patch"
      - ".github/workflows/apply-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'release completo para build e producao')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar e aplicar patch
        shell: bash
        run: |
          set -euo pipefail
          test -s prestacerto_release.patch
          git apply --check prestacerto_release.patch
          git apply --whitespace=nowarn prestacerto_release.patch
          rm prestacerto_release.patch

      - name: Commitar correcoes aplicadas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PrestaCerto Release Bot"
          git config user.email "release@prestacerto.com.br"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para aplicar."
            exit 0
          fi
          git commit -m "chore: aplicar correcoes de producao [skip ci]"
          git push origin main
