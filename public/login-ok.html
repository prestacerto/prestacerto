<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PrestaCerto</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h1 { text-align: center; margin-bottom: 30px; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:hover { background: #5568d3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .error { color: #dc3545; padding: 12px; background: #f8d7da; border-radius: 6px; margin-bottom: 20px; display: none; }
        .success { color: #155724; padding: 12px; background: #d4edda; border-radius: 6px; margin-bottom: 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Login PrestaCerto</h1>
        <div id="error" class="error"></div>
        <div id="success" class="success"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" value="finaltest@prestacerto.com.br" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="password" value="Test123456!" required>
            </div>
            <button type="submit">ENTRAR</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = "https://taktwwwpcyxhyylzmgho.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ArMX97jGsCK0jbe3Opd74g_ZNY2WQ36";

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            const submitBtn = document.querySelector('button[type="submit"]');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Entrando...';

            try {
                const response = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY
                    },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) {
                    throw new Error('Email ou senha incorretos');
                }

                const data = await response.json();

                if (!data.access_token) {
                    throw new Error('Falha ao fazer login');
                }

                successDiv.textContent = '✅ Login bem-sucedido! Entrando...';
                successDiv.style.display = 'block';

                document.cookie = `supabase-auth-token=${data.access_token}; path=/; max-age=604800; samesite=lax`;

                setTimeout(() => {
                    // Redirecionar pro site correto (produção ou localhost)
                    const baseUrl = window.location.hostname === 'localhost'
                        ? 'https://prestacerto.vercel.app'
                        : window.location.origin;
                    window.location.href = baseUrl + '/dashboard';
                }, 800);

            } catch (err) {
                errorDiv.textContent = '❌ ' + err.message;
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'ENTRAR';
            }
        });
    </script>
</body>
</html>
