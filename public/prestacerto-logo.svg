<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="300" fill="#f8f9fa"/>

  <!-- Main logo square -->
  <rect x="30" y="30" width="240" height="240" rx="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Checkmark circle background -->
  <circle cx="100" cy="100" r="55" fill="#3b82f6"/>

  <!-- Checkmark -->
  <path d="M 75 100 L 95 120 L 130 75" stroke="#ffffff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text: presta -->
  <text x="160" y="110" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#1f2937">presta</text>

  <!-- Text: certo (in blue) -->
  <text x="160" y="155" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#3b82f6">certo</text>

  <!-- Tagline -->
  <text x="150" y="200" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">
    Contrate talentos. Sem comissões.
  </text>
</svg>
